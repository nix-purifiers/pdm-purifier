[project]
name = "pdm-purifier"
version = "0.0.0.dev0"
description = "The PDM plugin of pdm-purifier: record and serve PDM's downloads"
license = "MIT"
requires-python = ">=3.10"

[project.entry-points.pdm]
pdm-purifier = "pdm_purifier:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
